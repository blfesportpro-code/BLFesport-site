name: Deploy BLFesport Airtable API

on:
  push:
    branches: [main]
    paths:
      - "workers/blfesport-airtable-api/**"
      - ".github/workflows/deploy-airtable-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blfesport-airtable-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Worker JavaScript syntax
        run: node --check workers/blfesport-airtable-api/src/index.js
      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/blfesport-airtable-api/wrangler.toml
